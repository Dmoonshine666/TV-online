
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电视导航</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="https://images.icon-icons.com/1851/PNG/512/televisionshelf_116541.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .search-container {
            max-width: 600px;
            margin: 0 auto 30px;
            position: relative;
        }
        
        .search-box {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border-radius: 50px;
            border: none;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            user-select: auto;
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
        }
        
        .search-box:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0a0c0;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .channel-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .channel-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .channel-card:active {
            transform: translateY(-2px);
        }
        
        .channel-number {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: white;
            box-shadow: 0 4px 8px rgba(67, 97, 238, 0.3);
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .channel-name {
            font-size: 0.95rem;
            color: #e0e0ff;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-word;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .filter-btn {
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            color: #c0c0e0;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        
        .filter-btn.active {
            background: linear-gradient(to right, #4361ee, #3a0ca3);
            color: white;
        }
        
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #a0a0c0;
            font-size: 1.1rem;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .no-results i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #4361ee;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 15px;
            }
            
            .channel-card {
                padding: 15px 10px;
            }
        }
        
        @media (max-width: 480px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 12px;
            }
            
            .channel-number {
                width: 36px;
                height: 36px;
                line-height: 36px;
                font-size: 1rem;
            }
            
            .channel-name {
                font-size: 0.85rem;
            }
            
            .search-box {
                padding: 12px 15px 12px 45px;
                font-size: 0.95rem;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .channel-card {
            animation: fadeIn 0.3s ease forwards;
            opacity: 0;
        }
        
        /* 为不同频道组添加不同的颜色标识 */
        .channel-card[data-group="央视"] .channel-number {
            background: linear-gradient(135deg, #f72585, #b5179e);
        }
        
        .channel-card[data-group="卫视"] .channel-number {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
        }
        
        .channel-card[data-group="地方"] .channel-number {
            background: linear-gradient(135deg, #4cc9f0, #4895ef);
        }
        
        .channel-card[data-group="最近观看"] .channel-number {
            background: linear-gradient(135deg, #7209b7, #560bad);
        }
        
        /* 最近观看标记样式 */
        .recent-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: linear-gradient(135deg, #7209b7, #560bad);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        /* 添加加载动画 */
        .loading {
            text-align: center;
            padding: 20px;
            color: #a0a0c0;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #4361ee;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 数字输入提示样式 */
        .input-hint {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(67, 97, 238, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        
        .input-hint.show {
            display: flex;
        }
        
        .input-hint .number {
            background: white;
            color: #4361ee;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .input-hint .timer {
            width: 30px;
            height: 30px;
            border: 3px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
    </style>
</head>

        // DOM元素

        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const inputHint = document.getElementById('inputHint');
        const inputNumber = document.getElementById('inputNumber');
        const countdownElement = document.getElementById('countdown');
        
        // 当前筛选条件
        let currentFilter = 'all';
        let currentSearch = '';
        
        // 数字输入相关变量
        let numberInput = '';
        let inputTimer = null;
        let countdown = 2;
        let countdownInterval = null;
        
        // 最近观看的频道ID列表
        let recentChannels = [];
        
        // 从localStorage加载最近观看的频道
        function loadRecentChannels() {
            try {
                const saved = localStorage.getItem('tv_recent_channels');
                if (saved) {
                    recentChannels = JSON.parse(saved);
                }
            } catch (e) {
                console.error('加载最近观看记录失败:', e);
                recentChannels = [];
            }
        }
        
        // 保存最近观看的频道到localStorage
        function saveRecentChannels() {
            try {
                localStorage.setItem('tv_recent_channels', JSON.stringify(recentChannels));
            } catch (e) {
                console.error('保存最近观看记录失败:', e);
            }
        }
        
        // 添加频道到最近观看列表
        function addToRecentChannels(channelId) {
            // 移除已存在的相同频道
            recentChannels = recentChannels.filter(id => id !== channelId);
            
            // 添加到列表开头
            recentChannels.unshift(channelId);
            
            // 限制只保留最近4个
            if (recentChannels.length > 4) {
                recentChannels = recentChannels.slice(0, 4);
            }
            
            // 保存到localStorage
            saveRecentChannels();
            
            // 如果当前正在查看最近观看列表，则重新渲染
            if (currentFilter === '最近观看') {
                renderChannels();
            }
        }
        
        // 显示加载状态

            channelsContainer.innerHTML = `

        }
        
        // 生成频道URL
        function generateChannelUrl(channel) {
            if (channel.url) {
                // 如果已有完整URL，直接使用
                return channel.url;
            } else if (channel.kankanewsId) {
                // 如果是kankanews频道，使用kankanews前缀+id
                return kankanewsPrefix + channel.kankanewsId;
            } else if (channel.pid) {
                // 如果是央视频道，使用统一前缀+pid
                return yangshipinPrefix + channel.pid;
            }
            return "#";
        }
        
        // 创建频道名称HTML
        function createChannelNameHtml(channelName) {
            // 检查是否是需要在两行显示的频道
            if (multiLineChannels[channelName]) {
                // 使用预定义的带<br>的HTML
                return `<div class="channel-name">${multiLineChannels[channelName]}</div>`;
            }
            // 普通频道名称
            return `<div class="channel-name">${channelName}</div>`;
        }
        
        // 初始化频道显示
        function renderChannels() {
            channelsContainer.innerHTML = '';
            
            let filteredChannels = [];
            
            if (currentFilter === '最近观看') {
                // 显示最近观看的频道
                filteredChannels = recentChannels
                    .map(id => channels.find(c => c.id === id))
                    .filter(channel => channel !== undefined);
                
                // 如果没有最近观看的频道，显示提示
                if (filteredChannels.length === 0) {
                    channelsContainer.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-history"></i>
                            <p>暂无最近观看的频道</p>
                            <p>点击任意频道开始记录观看历史</p>
                        </div>
                    `;
                    return;
                }
            } else {
                // 其他筛选条件
                filteredChannels = channels.filter(channel => {
                    // 应用筛选器
                    if (currentFilter !== 'all' && channel.group !== currentFilter) {
                        return false;
                    }
                    
                    // 应用搜索
                    if (currentSearch) {
                        const searchLower = currentSearch.toLowerCase();
                        return channel.name.toLowerCase().includes(searchLower) || 
                               channel.id.toString().includes(currentSearch);
                    }
                    
                    return true;
                });
            }
            
            if (filteredChannels.length === 0) {
                channelsContainer.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <p>未找到匹配的频道</p>
                        <p>请尝试其他搜索词或筛选条件</p>
                    </div>
                `;
                return;
            }
            
            // 为每个频道创建卡片
            filteredChannels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.setAttribute('data-group', currentFilter === '最近观看' ? '最近观看' : channel.group);
                card.setAttribute('data-id', channel.id);
                
                // 设置延迟动画
                card.style.animationDelay = `${filteredChannels.indexOf(channel) * 0.03}s`;
                
                // 生成URL
                const channelUrl = generateChannelUrl(channel);
                
                // 创建频道名称HTML
                const channelNameHtml = createChannelNameHtml(channel.name);
                
                // 检查是否是最近观看的频道
                const isRecent = recentChannels.includes(channel.id);
                const recentIndex = recentChannels.indexOf(channel.id);
                const recentBadge = isRecent && currentFilter !== '最近观看' ? 
                    `<div class="recent-badge">最近${recentIndex + 1}</div>` : '';
                
                card.innerHTML = `
                    <div class="channel-number">${channel.id}</div>
                    ${channelNameHtml}
                    ${recentBadge}
                `;
                
                // 添加点击事件 - 在新标签页中打开链接
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    // 添加到最近观看列表
                    addToRecentChannels(channel.id);
                    // 打开频道
                    window.open(channelUrl, '_blank');
                });
                
                channelsContainer.appendChild(card);
            });
        }
        
        // 搜索功能
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value.trim();
            renderChannels();
        });
        
        // 添加回车键搜索功能
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                // 阻止默认行为（可能触发表单提交）
                e.preventDefault();
                // 执行搜索（虽然input事件已经触发了，但这里可以确保搜索执行）
                currentSearch = e.target.value.trim();
                renderChannels();
            }
        });
        
        // 筛选功能
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                // 更新活动按钮
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                // 更新筛选条件
                currentFilter = button.getAttribute('data-filter');
                renderChannels();
            });
        });
        
        // 显示数字输入提示
        function showInputHint() {
            inputNumber.textContent = numberInput;
            countdownElement.textContent = countdown;
            inputHint.classList.add('show');
        }
        
        // 隐藏数字输入提示
        function hideInputHint() {
            inputHint.classList.remove('show');
            clearInterval(countdownInterval);
        }
        
        // 开始倒计时
        function startCountdown() {
            countdown = 2;
            countdownElement.textContent = countdown;
            
            clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                countdown--;
                countdownElement.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    openChannelByNumber();
                }
            }, 1000);
        }
        
        // 根据输入的数字打开频道
        function openChannelByNumber() {
            const channelId = parseInt(numberInput);
            const channel = channels.find(c => c.id === channelId);
            
            if (channel) {
                // 添加到最近观看列表
                addToRecentChannels(channel.id);
                const channelUrl = generateChannelUrl(channel);
                window.open(channelUrl, '_blank');
            }
            
            // 重置输入状态
            numberInput = '';
            hideInputHint();
        }
        
        // 处理数字输入
        function handleNumberInput(key) {
            // 如果当前焦点在搜索框，不处理数字输入
            if (document.activeElement === searchInput) {
                return;
            }
            
            // 添加到输入字符串
            numberInput += key;
            
            // 显示输入提示
            showInputHint();
            
            // 清除之前的计时器
            clearTimeout(inputTimer);
            clearInterval(countdownInterval);
            
            // 如果输入了两位数字，立即打开
            if (numberInput.length === 2) {
                const channelId = parseInt(numberInput);
                const channel = channels.find(c => c.id === channelId);
                
                if (channel) {
                    // 添加到最近观看列表
                    addToRecentChannels(channel.id);
                    const channelUrl = generateChannelUrl(channel);
                    window.open(channelUrl, '_blank');
                    
                    // 重置输入状态
                    numberInput = '';
                    hideInputHint();
                    return;
                }
            }
            
            // 如果输入了超过两位数字，只取前两位
            if (numberInput.length > 2) {
                numberInput = numberInput.slice(0, 2);
                inputNumber.textContent = numberInput;
            }
            
            // 重新开始倒计时
            startCountdown();
            
            // 设置2秒后自动打开
            inputTimer = setTimeout(() => {
                openChannelByNumber();
            }, 2000);
        }
        
        // 添加键盘快捷键支持
        document.addEventListener('keydown', (e) => {
            // 如果焦点在搜索框内，只处理ESC键
            if (document.activeElement === searchInput) {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    currentSearch = '';
                    renderChannels();
                    
                    // 同时清除数字输入
                    numberInput = '';
                    hideInputHint();
                }
                return;
            }
            
            // 按下ESC键清空搜索框和数字输入
            if (e.key === 'Escape') {
                searchInput.value = '';
                currentSearch = '';
                renderChannels();
                
                // 清除数字输入
                numberInput = '';
                hideInputHint();
                return;
            }
            
            // 处理数字键输入
            if (e.key >= '0' && e.key <= '9') {
                // 如果输入0并且当前没有输入，忽略（因为频道ID从1开始）
                if (e.key === '0' && numberInput === '') {
                    return;
                }
                
                handleNumberInput(e.key);
                return;
            }
            
            // 处理退格键 - 删除最后一位数字
            if (e.key === 'Backspace' && numberInput.length > 0) {
                numberInput = numberInput.slice(0, -1);
                
                if (numberInput.length === 0) {
                    hideInputHint();
                } else {
                    inputNumber.textContent = numberInput;
                    // 重置计时器
                    clearTimeout(inputTimer);
                    clearInterval(countdownInterval);
                    startCountdown();
                    
                    inputTimer = setTimeout(() => {
                        openChannelByNumber();
                    }, 2000);
                }
                return;
            }
        });
        
        // 添加响应式调整
        window.addEventListener('resize', () => {
            // 可以根据窗口大小调整布局
            const container = document.querySelector('.channels-grid');
            if (window.innerWidth < 480) {
                container.style.gap = '10px';
            } else {
                container.style.gap = '20px';
            }
        });
        
        // 初始加载最近观看记录
        loadRecentChannels();
        
        // 初始渲染
        showLoading();
        // 模拟加载延迟
        setTimeout(() => {
            renderChannels();
        }, 500);
    </script>
</body>
</html>
