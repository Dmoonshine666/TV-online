        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2a, #2a2a3a);

            /* 防止文字被选中 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* 允许搜索框内容被选中 */
        .search-box input, 
        .mobile-search-box input {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 顶部导航栏 */
        .top-nav {
            background: rgba(40, 40, 50, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            /* 确保文字不换行 */
            white-space: nowrap;
        }
        
        .logo i {
            margin-right: 10px;
            color: #ffffff;
        }
        
        /* 搜索区域 */
        .search-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 5px 15px;
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }
        
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 8px 0;
            font-size: 0.9rem;
            outline: none;
        }
        
        .search-box i {
            color: #aaa;
            margin-right: 8px;
        }
        
        /* 分类导航 */
        .categories {
            display: flex;
            gap: 5px;
        }
        
        .category-btn {
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }
        
        .category-btn.active, .category-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        
        /* 汉堡菜单 */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            width: 30px;
            height: 25px;
            justify-content: space-between;
        }
        
        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #fff;
            border-radius: 2px;
            transition: all 0.3s;
        }
        
        /* 移动端菜单 */
        .mobile-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(40, 40, 50, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .mobile-menu.active {
            display: block;
        }
        
        .mobile-search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 8px 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .mobile-search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 8px 0;
            font-size: 1rem;
            outline: none;
        }
        
        .mobile-categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .mobile-category-btn {
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .mobile-category-btn.active {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        /* 主内容区 */
        .main-content {
            padding: 30px 0;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        
        .page-header p {
            color: #aaa;
            font-size: 1.1rem;
        }
        
        /* 频道网格 - 卡片 */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .channel-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(15px);
        }
        
        .channel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .channel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), rgba(200, 200, 200, 0.8));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .channel-card:hover::before {

        }

        }
        
        .channel-desc {
            font-size: 0.85rem;

        }

            }
        }

        // 复制文本到剪贴板的函数
        function copyToClipboard(text) {
            return new Promise((resolve, reject) => {
                if (navigator.clipboard && window.isSecureContext) {
                    // 使用现代剪贴板API
                    navigator.clipboard.writeText(text).then(resolve).catch(reject);
                } else {
                    // 使用传统方法
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    textArea.style.top = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        const successful = document.execCommand('copy');
                        if (successful) {
                            resolve();
                        } else {
                            reject(new Error('复制失败'));
                        }
                    } catch (err) {
                        reject(err);
                    }
                    document.body.removeChild(textArea);
                }
            });
        }

        // 渲染频道卡片
        function renderChannels(filter = "全部") {
            const container = document.getElementById("channels-container");
            if (!container) return;
            
            container.innerHTML = "";
            
            const filteredChannels = filter === "全部" 
                ? channels 
                : channels.filter(channel => {
                    // 处理多分类逻辑
                    if (channel.id === 29 && (filter === "广播" || filter === "音乐")) { // 动感101
                        return true;
                    }
                    if (channel.id === 38 && (filter === "网络" || filter === "新闻")) { // 热点聚合
                        return true;
                    }
                    if (channel.id === 33 && (filter === "电影" || filter === "网络")) { // 腾讯视频
                        return true;
                    }
                    if (channel.id === 34 && (filter === "电影" || filter === "网络")) { // 爱奇艺
                        return true;
                    }
                    if (channel.id === 30 && (filter === "新闻" || filter === "广播")) { // 上海新闻
                        return true;
                    }
                    // 新增电视收视率的多分类逻辑
                    if (channel.id === 39 && (filter === "网络" || filter === "新闻")) { // 电视收视率
                        return true;
                    }
                    return channel.category === filter;
                });
            
            filteredChannels.forEach(channel => {
                const card = document.createElement("div");
                card.className = "channel-card";
                card.innerHTML = `
                    <div class="channel-logo">${channel.logo || '?'}</div>
                    <div class="channel-name">${channel.name || '未知频道'}</div>
                    <div class="channel-desc">${channel.desc || '暂无描述'}</div>
                `;
                
                // 为腾讯视频和爱奇艺添加复制功能
                if (channel.copyText) {
                    card.addEventListener("click", async function(e) {
                        e.preventDefault();
                        try {
                            // 复制文本到剪贴板
                            await copyToClipboard(channel.copyText);
                            // 打开链接
                            if (channel.link) {
                                window.open(channel.link, '_blank');
                            }
                        } catch (err) {
                            console.error('复制失败:', err);
                            // 即使复制失败也打开链接
                            if (channel.link) {
                                window.open(channel.link, '_blank');
                            }
                        }
                    });
                } else {
                    // 其他频道保持原有功能
                    card.addEventListener("click", function() {
                        if (channel.link) {
                            window.open(channel.link, '_blank');
                        }
                    });
                }
                
                container.appendChild(card);
            });
        }
        
        // 统一的搜索函数，支持不区分大小写的模糊搜索
        function performSearch(searchTerm) {
            const container = document.getElementById("channels-container");
            if (!container) return;
            
            if (!searchTerm) {
                const activeCategory = document.querySelector('.category-btn.active').textContent;
                renderChannels(activeCategory);
                return;
            }
            
            container.innerHTML = "";
            
            // 转换为小写进行不区分大小写的模糊搜索
            const searchTermLower = searchTerm.toLowerCase();
            const filteredChannels = channels.filter(channel => 
                channel.name.toLowerCase().includes(searchTermLower) || 
                channel.desc.toLowerCase().includes(searchTermLower) ||
                channel.category.toLowerCase().includes(searchTermLower)
            );
            
            if (filteredChannels.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #777;">未找到匹配的频道</div>`;
                return;
            }
            
            filteredChannels.forEach(channel => {
                const card = document.createElement("div");
                card.className = "channel-card";
                card.innerHTML = `
                    <div class="channel-logo">${channel.logo}</div>
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-desc">${channel.desc}</div>
                `;
                
                // 为腾讯视频和爱奇艺添加复制功能
                if (channel.copyText) {
                    card.addEventListener("click", async function(e) {
                        e.preventDefault();
                        try {
                            // 复制文本到剪贴板
                            await copyToClipboard(channel.copyText);
                            // 打开链接
                            window.open(channel.link, '_blank');
                        } catch (err) {
                            console.error('复制失败:', err);
                            // 即使复制失败也打开链接
                            window.open(channel.link, '_blank');
                        }
                    });
                } else {
                    // 其他频道保持原有功能
                    card.addEventListener("click", function() {
                        window.open(channel.link, '_blank');
                    });
                }
                
                container.appendChild(card);
            });
        }
        
        // 汉堡菜单功能
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');
        
        hamburger.addEventListener('click', function() {
            mobileMenu.classList.toggle('active');
            hamburger.classList.toggle('active');
        });
        
        // 关闭移动菜单当点击外部
        document.addEventListener('click', function(event) {
            if (!hamburger.contains(event.target) && !mobileMenu.contains(event.target)) {
                mobileMenu.classList.remove('active');
                hamburger.classList.remove('active');
            }
        });
        
        // 移动端分类按钮事件
        document.querySelectorAll('.mobile-category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mobile-category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.category-btn').forEach(b => {
                    if (b.textContent === this.textContent) {
                        b.classList.add('active');
                    } else {
                        b.classList.remove('active');
                    }
                });
                renderChannels(this.textContent);
                mobileMenu.classList.remove('active');
                hamburger.classList.remove('active');
            });
        });
        
        // 桌面端分类按钮事件
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.mobile-category-btn').forEach(b => {
                    if (b.textContent === this.textContent) {
                        b.classList.add('active');
                    } else {
                        b.classList.remove('active');
                    }
                });
                renderChannels(this.textContent);
            });
        });
        
        // PC端搜索功能
        document.getElementById('searchInput').addEventListener('input', function() {
            performSearch(this.value);
        });
        
        // 移动端搜索功能
        document.getElementById('mobileSearchInput').addEventListener('input', function() {
            performSearch(this.value);
        });
        
        // 初始渲染
        renderChannels();
    </script>
</body>
</html>
